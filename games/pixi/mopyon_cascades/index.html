<div id="splash"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="fill" cx="50" cy="50" r="46" pathLength="100"/></svg><span class="pct">0%</span></div></div>
<script>
// Drives the splash from the first byte. Until the game's code has arrived there is nothing to
// count, so the ring creeps towards a quarter on its own; main.ts then reports the real share of
// files landed. What is shown eases towards that and keeps creeping, more and more slowly, while
// the next file is on its way, so it never stands still, never jumps and never shows 100 early.
;(function(){
  // The splash wears the chosen brand and theme from the first frame: the ring and figures in
  // the brand's primary colour, on its panel surface. The kit confirms both when it starts.
  // A link names the tenant, which is the brand; older links name the brand itself.
  var query=new URLSearchParams(location.search),tenants=(window.CrashTokens&&window.CrashTokens.TENANTS)||{}
  var brand=tenants[query.get('tenantId')]||query.get('brand'),theme=query.get('theme')
  if(brand&&brand!=='default')document.documentElement.dataset.brand=brand
  if(theme)document.documentElement.dataset.theme=theme
  var ring=document.querySelector('#splash .fill'),pct=document.querySelector('#splash .pct')
  var real=0,shown=0,since=performance.now(),last=since,full=[]
  window.splashProgress={
    set:function(share){if(share>real){real=Math.min(1,share);since=performance.now()}},
    // Calls back once the ring has been seen full, so the splash never fades out at 90%.
    whenFull:function(callback){if(shown>=0.995)callback();else full.push(callback)}
  }
  function frame(now){
    var dt=Math.min(0.1,(now-last)/1000);last=now
    // Before the code reports anything the creep aims at a quarter; after, at a third of
    // what is left, approached ever more slowly until the next file lands.
    var ceiling=real===0?0.25:real>=1?1:real+(1-real)*0.35
    var goal=real>=1?1:real+(ceiling-real)*(1-Math.exp(-(now-since)/2500))
    shown=Math.max(shown,shown+(goal-shown)*Math.min(1,dt*(real>=1?14:6)))
    if(real>=1&&1-shown<0.005)shown=1
    var share=Math.floor(shown*100+1e-6)
    ring.style.strokeDashoffset=String(100-share);pct.textContent=share+'%'
    if(shown>=1){while(full.length)full.shift()();return}
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})()
</script>
<!-- The scene: between the kit's header and its bet panel, the cascade ladder and the board. -->
